name: 24/7 Supercar Market Crawler & Intelligence

on:
  schedule:
    # Runs once every 24 hours (daily at 03:00 UTC)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime
  push:
    branches:
      - main
    paths:
      - 'engine/**'
      - 'data/**'

permissions:
  contents: write

jobs:
  crawl_and_analyze:
    name: Run Autonomous Market Intelligence Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: Run Market Crawler
        run: |
          python engine/market_crawler.py

      - name: Commit and Push Updated Market Database
        run: |
          git config --local user.name "LamboSpec Intelligence Bot"
          git config --local user.email "bot@lambospec.ai"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): Auto-update supercar market intelligence and comps [skip ci]" && git push)
